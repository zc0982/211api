log:
  level: info

runner:
  file: .runner
  capacity: 1
  envs:
    GOFLAGS: -p=1
  env_file: ""
  timeout: 3h
  shutdown_timeout: 5m
  insecure: false
  labels: []
  allocate_pty: false
  post_task_script: /usr/local/bin/gitea-runner-cache-maintenance
  post_task_script_timeout: 2m

cache:
  enabled: true
  dir: /data/cache/actions
  host: gitea-runner-cache
  port: 8088
  external_server: ""
  external_secret: ""
  offline_mode: true

container:
  network: ""
  network_create_options:
    enable_ipv4: true
    enable_ipv6: false
  privileged: false
  options: ""
  valid_volumes: []
  docker_host: unix:///run/user/1000/docker.sock
  force_pull: false
  force_rebuild: false
  require_docker: true
  docker_timeout: 30s
  bind_workdir: false

host:
  workdir_parent: ""

metrics:
  enabled: false
  addr: 127.0.0.1:9101
