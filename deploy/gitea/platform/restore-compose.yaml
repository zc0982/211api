name: ${RESTORE_PROJECT:?RESTORE_PROJECT is required}

x-local-logging: &local-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  secret-init:
    image: ${APP_ALPINE_IMAGE:?APP_ALPINE_IMAGE is required}
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - restore_runtime_secrets:/staged
    secrets:
      - gitea_db_password
      - gitea_secret_key
      - gitea_internal_token
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /staged
        chown 1000:1000 /staged
        chmod 0700 /staged
        for name in gitea_db_password gitea_secret_key gitea_internal_token; do
          test -s "/run/secrets/$${name}"
          cp "/run/secrets/$${name}" "/staged/.$${name}.partial"
          chown 1000:1000 "/staged/.$${name}.partial"
          chmod 0400 "/staged/.$${name}.partial"
          mv -f "/staged/.$${name}.partial" "/staged/$${name}"
        done
    logging: *local-logging

  postgres:
    image: ${GITEA_POSTGRES_IMAGE:?GITEA_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/gitea_db_password
      TZ: UTC
    secrets:
      - gitea_db_password
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gitea -d gitea
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - restore
    logging: *local-logging

  gitea:
    image: ${GITEA_IMAGE:?GITEA_IMAGE is required}
    user: "1000:1000"
    depends_on:
      secret-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: UTC
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/gitea-secrets/gitea_db_password
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__ROOT_URL: http://127.0.0.1:${RESTORE_HTTP_PORT:?RESTORE_HTTP_PORT is required}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__DISABLE_GIT_HOOKS: "true"
      GITEA__security__SECRET_KEY__FILE: /run/gitea-secrets/gitea_secret_key
      GITEA__security__INTERNAL_TOKEN__FILE: /run/gitea-secrets/gitea_internal_token
      GITEA__packages__ENABLED: "true"
    volumes:
      - restore_gitea_data:/var/lib/gitea
      - restore_gitea_config:/etc/gitea
      - restore_runtime_secrets:/run/gitea-secrets:ro
    ports:
      - "127.0.0.1:${RESTORE_HTTP_PORT}:3000/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 5 -O /dev/null http://127.0.0.1:3000/api/healthz
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - restore
    logging: *local-logging

secrets:
  gitea_db_password:
    file: ${RESTORE_DB_PASSWORD_FILE:?RESTORE_DB_PASSWORD_FILE is required}
  gitea_secret_key:
    file: ${RESTORE_SECRET_KEY_FILE:?RESTORE_SECRET_KEY_FILE is required}
  gitea_internal_token:
    file: ${RESTORE_INTERNAL_TOKEN_FILE:?RESTORE_INTERNAL_TOKEN_FILE is required}

volumes:
  restore_postgres_data:
    external: true
    name: ${RESTORE_POSTGRES_VOLUME:?RESTORE_POSTGRES_VOLUME is required}
  restore_gitea_data:
    external: true
    name: ${RESTORE_GITEA_DATA_VOLUME:?RESTORE_GITEA_DATA_VOLUME is required}
  restore_gitea_config:
    external: true
    name: ${RESTORE_GITEA_CONFIG_VOLUME:?RESTORE_GITEA_CONFIG_VOLUME is required}
  restore_runtime_secrets:
    external: true
    name: ${RESTORE_RUNTIME_SECRETS_VOLUME:?RESTORE_RUNTIME_SECRETS_VOLUME is required}

networks:
  restore:
    driver: bridge
    internal: true
    enable_ipv6: false
