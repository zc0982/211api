name: gitea-platform

x-local-logging: &local-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  secret-init:
    image: ${APP_ALPINE_IMAGE:?APP_ALPINE_IMAGE is required}
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - gitea_runtime_secrets:/staged
    secrets:
      - gitea_db_password
      - gitea_secret_key
      - gitea_internal_token
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /staged
        chown 1000:1000 /staged
        chmod 0700 /staged
        for name in gitea_db_password gitea_secret_key gitea_internal_token; do
          test -s "/run/secrets/$${name}"
          cp "/run/secrets/$${name}" "/staged/.$${name}.partial"
          chown 1000:1000 "/staged/.$${name}.partial"
          chmod 0400 "/staged/.$${name}.partial"
          mv -f "/staged/.$${name}.partial" "/staged/$${name}"
        done
    mem_limit: 64m
    cpus: 0.10
    logging: *local-logging

  postgres:
    image: ${GITEA_POSTGRES_IMAGE:?GITEA_POSTGRES_IMAGE is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/gitea_db_password
      TZ: UTC
    secrets:
      - gitea_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gitea -d gitea
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    networks:
      - platform
    logging: *local-logging

  gitea:
    image: ${GITEA_IMAGE:?GITEA_IMAGE is required}
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: UTC
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/gitea-secrets/gitea_db_password
      GITEA__server__DOMAIN: git.211api.com
      GITEA__server__ROOT_URL: https://git.211api.com/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: git.211api.com
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DISABLE_REGULAR_ORG_CREATION: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__actions__ENABLED: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__DISABLE_GIT_HOOKS: "true"
      GITEA__security__SECRET_KEY__FILE: /run/gitea-secrets/gitea_secret_key
      GITEA__security__INTERNAL_TOKEN__FILE: /run/gitea-secrets/gitea_internal_token
      GITEA__packages__ENABLED: "true"
      GITEA__log__MODE: console,file
      GITEA__log__file__FILE_NAME: /var/lib/gitea/log/gitea.log
      GITEA__log__file__DAILY_ROTATE: "true"
      GITEA__log__file__MAX_DAYS: "14"
      GITEA__log__file__MAX_SIZE_SHIFT: "24"
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
      - gitea_runtime_secrets:/run/gitea-secrets:ro
      - /opt/gitea/platform/log:/var/lib/gitea/log
    ports:
      - "37.221.194.27:2222:2222/tcp"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 5 -O /dev/null http://127.0.0.1:3000/api/healthz
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    networks:
      - platform
    logging: *local-logging

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - /opt/gitea/platform/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "37.221.194.27:80:80/tcp"
      - "37.221.194.27:443:443/tcp"
    mem_limit: 256m
    networks:
      - platform
    logging: *local-logging

secrets:
  gitea_db_password:
    file: ${GITEA_DB_PASSWORD_FILE:?GITEA_DB_PASSWORD_FILE is required}
  gitea_secret_key:
    file: ${GITEA_SECRET_KEY_FILE:?GITEA_SECRET_KEY_FILE is required}
  gitea_internal_token:
    file: ${GITEA_INTERNAL_TOKEN_FILE:?GITEA_INTERNAL_TOKEN_FILE is required}

volumes:
  postgres_data:
    name: gitea-platform-postgres-data
  gitea_data:
    name: gitea-platform-gitea-data
  gitea_config:
    name: gitea-platform-gitea-config
  gitea_runtime_secrets:
    name: gitea-platform-runtime-secrets
  caddy_data:
    name: gitea-platform-caddy-data
  caddy_config:
    name: gitea-platform-caddy-config

networks:
  platform:
    name: gitea-platform-network
    driver: bridge
    enable_ipv6: false
