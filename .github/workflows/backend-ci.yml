name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支/PR 上新 push 取消仍在跑的旧 run，避免连续提交时排队浪费额度。
# main 分支不取消：main 的每次 CI 结果都对应一次实际部署，需要完整留档。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 变更检测：按改动路径决定后续哪些 job 需要真正执行。
  # 纯文档/纯配置改动不再拉起后端测试与 lint。
  changes:
    runs-on: ubuntu-latest
    # paths-filter 在 pull_request 下需调用 API 列出 PR 改动文件，
    # 顶层仅有 contents:read 会导致 "Resource not accessible by integration"。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.work'
              - '.github/workflows/backend-ci.yml'
              - 'Makefile'
            frontend:
              - 'frontend/**'
              - 'docs/legal/**'
              - '.github/workflows/backend-ci.yml'
              - 'Makefile'
            deploy:
              - 'deploy/**'
              - '.github/workflows/backend-ci.yml'

  shell:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      # setup-go 的 cache 只覆盖模块下载缓存（~/go/pkg/mod），不含编译产物。
      # 实测 CI 上 unit 步骤 409s 中约 250s 是编译、仅 161s 是测试执行，
      # 编译才是真正的瓶颈，故显式缓存 GOCACHE。
      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-test-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-test-${{ hashFiles('backend/go.sum') }}-
            ${{ runner.os }}-gobuild-test-
      - name: Verify INTEGRATION_PKGS is up to date
        working-directory: backend
        run: make test-integration-pkgs-check
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      # 与 test job 用不同 key 前缀：两者编译的 tag 组合不同，
      # 共用同一 key 会互相覆盖导致双方命中率都下降。
      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-lint-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-lint-${{ hashFiles('backend/go.sum') }}-
            ${{ runner.os }}-gobuild-lint-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  # 聚合门禁：始终执行，供分支保护规则作为唯一 required check。
  # 上面的 job 因路径过滤被 skip 时视为通过，但只要有 job 失败/取消就失败，
  # 避免 skipped 状态让 required check 永久 pending。
  ci-ok:
    if: always()
    needs: [changes, shell, test, frontend, golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "依赖 job 结果: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "存在未通过的 job（$r），CI 失败" >&2; exit 1 ;;
            esac
          done
          echo "CI 全部通过"
