name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 串行化部署：并发 push main 时排队执行，避免后一个 run 覆盖 :main 后
# 前一个 run 在服务器上拉到并非自己构建的镜像。不取消进行中的 run，
# 让每次部署都完整跑完健康检查。
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/211api/deploy
  # :main 仅作为可读的“当前生产版本”指针，实际部署一律按 commit SHA 绑定
  IMAGE_TAG: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        run: |
          docker build \
            -t "${{ steps.image.outputs.name }}:${IMAGE_TAG}" \
            -t "${{ steps.image.outputs.name }}:${GITHUB_SHA}" \
            .
          docker push "${{ steps.image.outputs.name }}:${GITHUB_SHA}"
          docker push "${{ steps.image.outputs.name }}:${IMAGE_TAG}"

          # 记录本次构建的不可变 digest，供服务器侧校验实际拉到的镜像
          digest="$(docker image inspect \
            "${{ steps.image.outputs.name }}:${GITHUB_SHA}" \
            --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          if [[ -z "$digest" ]]; then
            echo "无法解析构建镜像的 digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "本次部署镜像 digest: ${digest}"

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}' '${DEPLOY_PATH}/data' '${DEPLOY_PATH}/postgres_data' '${DEPLOY_PATH}/redis_data'"

          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" \
            deploy/docker-compose.local.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/docker-compose.yml"

      - name: Write production env
        run: |
          printf '%s' '${{ secrets.PROD_ENV_B64 }}' | base64 -d > .env.production
          chmod 600 .env.production

          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" \
            .env.production \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/.env"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' &&
             deploy_image='${{ steps.image.outputs.name }}:${GITHUB_SHA}' &&
             expected_digest='${{ steps.build.outputs.digest }}' &&
             echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin &&
             pull_ok=0 &&
             for attempt in 1 2 3 4 5; do
               if SUB2API_IMAGE=\"\$deploy_image\" docker compose pull; then
                 pull_ok=1
                 break
               fi
               echo \"拉取镜像失败（第 \${attempt}/5 次），\$((attempt * 10))s 后重试\" >&2
               sleep \$((attempt * 10))
             done &&
             if [ \"\$pull_ok\" != 1 ]; then
               echo \"镜像拉取重试 5 次仍失败，终止部署（未改动线上容器）\" >&2
               exit 1
             fi &&
             actual_digest=\$(docker image inspect \"\$deploy_image\" --format '{{index .RepoDigests 0}}' | cut -d@ -f2) &&
             if [ \"\$actual_digest\" != \"\$expected_digest\" ]; then
               echo \"镜像 digest 不匹配：期望 \$expected_digest，实际 \$actual_digest\" >&2
               exit 1
             fi &&
             SUB2API_IMAGE=\"\$deploy_image\" docker compose up -d &&
             docker compose ps &&
             server_port=\$(grep -E '^SERVER_PORT=' .env | tail -n 1 | cut -d= -f2- | tr -d '\"' || true) &&
             server_port=\${server_port:-8080} &&
             health_ok=0 &&
             for attempt in \$(seq 1 60); do
               if curl -fsS \"http://127.0.0.1:\${server_port}/health\"; then
                 health_ok=1
                 break
               fi
               echo \"Waiting for health check... attempt \${attempt}/60\"
               sleep 5
             done &&
             if [ \"\$health_ok\" != 1 ]; then
               echo '健康检查在 300s 内未通过，输出容器状态与日志：' >&2
               docker compose ps
               docker compose logs --tail=120 sub2api
               exit 1
             fi"
