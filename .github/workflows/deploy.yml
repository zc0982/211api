name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/211api/deploy
  IMAGE_TAG: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build \
            -t "${{ steps.image.outputs.name }}:${IMAGE_TAG}" \
            -t "${{ steps.image.outputs.name }}:${GITHUB_SHA}" \
            .
          docker push "${{ steps.image.outputs.name }}:${IMAGE_TAG}"
          docker push "${{ steps.image.outputs.name }}:${GITHUB_SHA}"

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}' '${DEPLOY_PATH}/data' '${DEPLOY_PATH}/postgres_data' '${DEPLOY_PATH}/redis_data'"

          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" \
            deploy/docker-compose.local.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/docker-compose.yml"

      - name: Write production env
        run: |
          printf '%s' '${{ secrets.PROD_ENV_B64 }}' | base64 -d > .env.production
          chmod 600 .env.production

          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" \
            .env.production \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/.env"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' &&
             echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin &&
             SUB2API_IMAGE='${{ steps.image.outputs.name }}:${IMAGE_TAG}' docker compose pull &&
             SUB2API_IMAGE='${{ steps.image.outputs.name }}:${IMAGE_TAG}' docker compose up -d &&
             docker compose ps &&
             server_port=\$(grep -E '^SERVER_PORT=' .env | tail -n 1 | cut -d= -f2- | tr -d '\"' || true) &&
             server_port=\${server_port:-8080} &&
             for attempt in \$(seq 1 60); do
               if curl -fsS \"http://127.0.0.1:\${server_port}/health\"; then
                 exit 0
               fi
               echo \"Waiting for health check... attempt \${attempt}/60\"
               sleep 5
             done
             docker compose ps
             docker compose logs --tail=120 sub2api
             exit 1"
