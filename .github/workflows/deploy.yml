name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Production maintenance operation
        required: true
        default: cloudflared-preflight
        type: choice
        options:
          - cloudflared-preflight
          - cloudflared-update-2026.8.2

permissions:
  contents: read
  packages: write

# 串行化部署：并发 push main 时排队执行，避免后一个 run 覆盖 :main 后
# 前一个 run 在服务器上拉到并非自己构建的镜像。不取消进行中的 run，
# 让每次部署都完整跑完健康检查。
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/211api/deploy
  # :main 仅作为可读的“当前生产版本”指针，实际部署一律按 commit SHA 绑定
  IMAGE_TAG: main

jobs:
  # 门禁：等待同一 commit 的 CI 工作流通过后再部署。
  # 原先 Deploy 与 CI 并行启动，测试还没跑完镜像就已经上生产，
  # 单测失败的代码同样会被部署。
  wait-ci:
    runs-on: ubuntu-latest
    # 手动触发（workflow_dispatch）时该 commit 可能没有对应的 CI run，
    # 直接等待会超时卡死，因此仅对 push main 强制门禁。
    if: github.event_name == 'push'
    steps:
      - name: Wait for CI to succeed
        # ci-ok 需等待 race-service 完成才会创建；Deploy 先启动时，
        # 留出 35 分钟发现窗口以避免把“检查尚未注册”误判为失败。
        uses: lewagon/wait-on-check-action@v1.8.1
        with:
          ref: ${{ github.sha }}
          check-name: ci-ok
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          checks-discovery-timeout: 2100
          wait-interval: 15
          allowed-conclusions: success,skipped

  cloudflared-maintenance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'cloudflared-preflight' ||
      inputs.operation == 'cloudflared-update-2026.8.2')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect cloudflared installation
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "host=$(hostnamectl --static 2>/dev/null || hostname)"
          if [[ -r /etc/os-release ]]; then
            . /etc/os-release
            echo "os=${ID:-unknown} version=${VERSION_ID:-unknown} codename=${VERSION_CODENAME:-unknown}"
          fi
          echo "machine_arch=$(uname -m)"
          if command -v dpkg >/dev/null 2>&1; then
            echo "package_arch=$(dpkg --print-architecture)"
          fi

          unit_files=()
          while IFS= read -r unit; do
            [[ -n "$unit" ]] && unit_files+=("$unit")
          done < <(
            {
              systemctl list-unit-files --type=service --no-legend 2>/dev/null \
                | awk 'tolower($1) ~ /cloudflared/ {print $1}'
              grep -RIl --include='*.service' 'cloudflared' \
                /etc/systemd/system /usr/lib/systemd/system /lib/systemd/system 2>/dev/null \
                | xargs -r -n1 basename
            } | sort -u
          )

          if ((${#unit_files[@]})); then
            printf 'systemd_units=%s\n' "${unit_files[*]}"
            for unit in "${unit_files[@]}"; do
              systemctl show "$unit" --no-pager \
                -p LoadState -p ActiveState -p SubState -p UnitFileState \
                -p FragmentPath -p MainPID -p ExecMainStatus
            done
          else
            echo 'systemd_units=<none>'
          fi

          binary=''
          if command -v cloudflared >/dev/null 2>&1; then
            binary=$(readlink -f "$(command -v cloudflared)")
          else
            for unit in "${unit_files[@]}"; do
              pid=$(systemctl show "$unit" -p MainPID --value 2>/dev/null || true)
              if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && [[ -e "/proc/$pid/exe" ]]; then
                candidate=$(readlink -f "/proc/$pid/exe")
                if [[ $(basename "$candidate") == cloudflared ]]; then
                  binary=$candidate
                  break
                fi
              fi
            done
          fi

          if [[ -n "$binary" ]]; then
            echo 'install_surface=native'
            echo "binary=$binary"
            "$binary" version --short 2>&1 || "$binary" version 2>&1
            if command -v dpkg-query >/dev/null 2>&1 \
              && dpkg-query -W cloudflared >/dev/null 2>&1; then
              echo 'package_manager=dpkg'
              dpkg-query -W -f='package_status=${db:Status-Status}\npackage_version=${Version}\npackage_architecture=${Architecture}\n' cloudflared
            elif [[ -e /usr/local/etc/cloudflared/.installedFromPackageManager ]]; then
              echo 'package_manager=marker-present'
            else
              echo 'package_manager=standalone-binary'
            fi
            exit 0
          fi

          container_found=0
          if command -v docker >/dev/null 2>&1; then
            while IFS=$'\t' read -r name image status; do
              [[ -z "$name" ]] && continue
              if [[ "${name,,} ${image,,}" == *cloudflared* ]]; then
                container_found=1
                printf 'container_runtime=docker name=%s image=%s status=%s\n' "$name" "$image" "$status"
                docker exec "$name" cloudflared version --short 2>&1 \
                  || docker exec "$name" cloudflared version 2>&1 \
                  || true
              fi
            done < <(docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}')
          fi

          if command -v podman >/dev/null 2>&1; then
            while IFS=$'\t' read -r name image status; do
              [[ -z "$name" ]] && continue
              if [[ "${name,,} ${image,,}" == *cloudflared* ]]; then
                container_found=1
                printf 'container_runtime=podman name=%s image=%s status=%s\n' "$name" "$image" "$status"
                podman exec "$name" cloudflared version --short 2>&1 \
                  || podman exec "$name" cloudflared version 2>&1 \
                  || true
              fi
            done < <(podman ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}')
          fi

          if ((container_found == 0)); then
            echo 'cloudflared_installation=<not-found>' >&2
            exit 20
          fi
          REMOTE

      - name: Update cloudflared to 2026.8.2
        if: inputs.operation == 'cloudflared-update-2026.8.2'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          readonly target_version='2026.8.2'
          readonly expected_current_version='2026.7.1'
          readonly expected_sha256='fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2'
          readonly service='cloudflared-211api.service'
          readonly binary='/usr/local/bin/cloudflared'
          readonly release_url="https://github.com/cloudflare/cloudflared/releases/download/${target_version}/cloudflared-linux-amd64"

          changed=0
          backup=''
          owner=''
          group=''
          mode=''

          rollback() {
            original_status=$?
            trap - ERR
            set +e
            if ((changed == 1)) && [[ -n "$backup" && -f "$backup" ]]; then
              echo "upgrade_failed=true; restoring=$backup" >&2
              install -o "$owner" -g "$group" -m "$mode" "$backup" "${binary}.rollback"
              mv -f "${binary}.rollback" "$binary"
              systemctl restart "$service"
              restored_version=$($binary version --short 2>/dev/null)
              restored_state=$(systemctl is-active "$service" 2>/dev/null)
              echo "rollback_version=$restored_version"
              echo "rollback_service_state=$restored_state"
              if [[ "$restored_version" != "$expected_current_version" || "$restored_state" != active ]]; then
                echo 'automatic_rollback=<failed>' >&2
              else
                echo 'automatic_rollback=<succeeded>' >&2
              fi
            fi
            exit "$original_status"
          }
          trap rollback ERR

          [[ $(uname -m) == x86_64 ]]
          [[ $(readlink -f "$(command -v cloudflared)") == "$binary" ]]
          [[ $(systemctl show "$service" -p LoadState --value) == loaded ]]
          [[ $(systemctl is-enabled "$service") == enabled ]]
          [[ $(systemctl is-active "$service") == active ]]

          current_version=$($binary version --short)
          echo "current_version=$current_version"
          echo "target_version=$target_version"
          if [[ "$current_version" == "$target_version" ]]; then
            echo 'upgrade=<already-current>'
            exit 0
          fi
          [[ "$current_version" == "$expected_current_version" ]]

          owner=$(stat -c '%u' "$binary")
          group=$(stat -c '%g' "$binary")
          mode=$(stat -c '%a' "$binary")
          old_pid=$(systemctl show "$service" -p MainPID --value)

          work_dir=$(mktemp -d /var/tmp/cloudflared-update.XXXXXX)
          candidate="$work_dir/cloudflared-${target_version}"
          trap 'rm -f "$candidate"; rmdir "$work_dir" 2>/dev/null || true' EXIT

          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$candidate" "$release_url"
          printf '%s  %s\n' "$expected_sha256" "$candidate" | sha256sum -c -
          chmod 0755 "$candidate"
          candidate_version=$($candidate version --short)
          echo "candidate_version=$candidate_version"
          [[ "$candidate_version" == "$target_version" ]]

          backup_dir='/var/lib/cloudflared-maintenance/backups'
          install -d -m 0700 "$backup_dir"
          backup="$backup_dir/cloudflared-${current_version}-$(date -u +%Y%m%dT%H%M%SZ)"
          cp --preserve=mode,ownership,timestamps "$binary" "$backup"
          sha256sum "$backup" > "${backup}.sha256"
          echo "backup=$backup"

          install -o "$owner" -g "$group" -m "$mode" "$candidate" "${binary}.new"
          mv -f "${binary}.new" "$binary"
          changed=1
          systemctl restart "$service"

          for attempt in $(seq 1 30); do
            if [[ $(systemctl is-active "$service" 2>/dev/null) == active ]]; then
              break
            fi
            sleep 1
          done

          new_version=$($binary version --short)
          new_state=$(systemctl is-active "$service")
          new_pid=$(systemctl show "$service" -p MainPID --value)
          exec_status=$(systemctl show "$service" -p ExecMainStatus --value)
          echo "new_version=$new_version"
          echo "service_state=$new_state"
          echo "service_pid_changed=$([[ "$new_pid" != "$old_pid" ]] && echo true || echo false)"
          echo "service_exec_status=$exec_status"
          [[ "$new_version" == "$target_version" ]]
          [[ "$new_state" == active ]]
          [[ "$new_pid" =~ ^[1-9][0-9]*$ && "$new_pid" != "$old_pid" ]]
          [[ "$exec_status" == 0 ]]

          metrics_verified=0
          for port in 20241 20242 20243 20244 20245; do
            metrics=$(curl --fail --silent --max-time 2 "http://127.0.0.1:${port}/metrics" 2>/dev/null || true)
            [[ -z "$metrics" ]] && continue
            ha_connections=$(printf '%s\n' "$metrics" \
              | awk '$1 == "cloudflared_tunnel_ha_connections" {sum += $2} END {print sum + 0}')
            echo "metrics_port=$port"
            echo "ha_connections=$ha_connections"
            awk -v value="$ha_connections" 'BEGIN {exit !(value > 0)}'
            metrics_verified=1
            break
          done
          echo "metrics_verified=$metrics_verified"

          health=''
          for attempt in $(seq 1 12); do
            if health=$(curl --fail --silent --show-error --max-time 10 \
              'https://www.211api.com/health'); then
              break
            fi
            sleep 5
          done
          echo "public_health=$health"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<<"$health"

          changed=0
          trap - ERR
          echo 'upgrade=<succeeded>'
          REMOTE

  deploy:
    needs: wait-ci
    # 应用部署只允许 main push 在 CI 通过后进入。生产维护的
    # workflow_dispatch 不得构建镜像、覆盖配置或重启应用。
    if: always() && github.event_name == 'push' && needs.wait-ci.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and verify build version
        id: version
        run: |
          backend/scripts/verify-version.sh
          version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "本次部署版本: $version"

      - name: Set image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx 才能使用 GitHub Actions 缓存后端。裸 docker build 在每次全新
      # runner 上都是冷构建，Dockerfile 里的 --mount=type=cache 只在本机有效，
      # 跨 run 命中率为零。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # 跨 run 复用 pnpm install / go mod download / go build 的层与 cache mount
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Record image digest
        id: digest
        run: |
          digest='${{ steps.build.outputs.digest }}'
          if [[ -z "$digest" ]]; then
            echo "无法解析构建镜像的 digest" >&2
            exit 1
          fi
          echo "本次部署镜像 digest: ${digest}"

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}' '${DEPLOY_PATH}/data' '${DEPLOY_PATH}/postgres_data' '${DEPLOY_PATH}/redis_data'"

          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" \
            deploy/docker-compose.local.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/docker-compose.yml"

      - name: Write production env
        run: |
          printf '%s' '${{ secrets.PROD_ENV_B64 }}' | base64 -d > .env.production
          chmod 600 .env.production

          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" \
            .env.production \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/.env"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' &&
             deploy_image='${{ steps.image.outputs.name }}:${GITHUB_SHA}' &&
             expected_digest='${{ steps.build.outputs.digest }}' &&
             echo "期望 digest: \$expected_digest" &&
             echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin &&
             pull_ok=0 &&
             for attempt in 1 2 3 4 5; do
               if SUB2API_IMAGE=\"\$deploy_image\" docker compose pull; then
                 pull_ok=1
                 break
               fi
               echo \"拉取镜像失败（第 \${attempt}/5 次），\$((attempt * 10))s 后重试\" >&2
               sleep \$((attempt * 10))
             done &&
             if [ \"\$pull_ok\" != 1 ]; then
               echo \"镜像拉取重试 5 次仍失败，终止部署（未改动线上容器）\" >&2
               exit 1
             fi &&
             actual_digest=\$(docker image inspect \"\$deploy_image\" --format '{{index .RepoDigests 0}}' | cut -d@ -f2) &&
             if [ \"\$actual_digest\" != \"\$expected_digest\" ]; then
               echo \"镜像 digest 不匹配：期望 \$expected_digest，实际 \$actual_digest\" >&2
               exit 1
             fi &&
             SUB2API_IMAGE=\"\$deploy_image\" docker compose up -d &&
             docker compose ps &&
             server_port=\$(grep -E '^SERVER_PORT=' .env | tail -n 1 | cut -d= -f2- | tr -d '\"' || true) &&
             server_port=\${server_port:-8080} &&
             health_ok=0 &&
             for attempt in \$(seq 1 60); do
               if curl -fsS \"http://127.0.0.1:\${server_port}/health\"; then
                 health_ok=1
                 break
               fi
               echo \"Waiting for health check... attempt \${attempt}/60\"
               sleep 5
             done &&
             if [ \"\$health_ok\" != 1 ]; then
               echo '健康检查在 300s 内未通过，输出容器状态与日志：' >&2
               docker compose ps
               docker compose logs --tail=120 sub2api
               exit 1
             fi &&
             expected_version='${{ steps.version.outputs.value }}' &&
             version_output=\$(SUB2API_IMAGE=\"\$deploy_image\" docker compose exec -T sub2api /app/sub2api --version 2>&1) &&
             echo \"运行中二进制版本: \$version_output\" &&
             running_version=\$(printf '%s\\n' \"\$version_output\" | sed -n 's/.*Sub2API \\([0-9][0-9]*\\.[0-9][0-9]*\\.[0-9][0-9]*\\).*/\\1/p' | tail -n 1) &&
             if [ -z \"\$running_version\" ] || [ \"\$running_version\" != \"\$expected_version\" ]; then
               echo \"运行中版本不匹配：期望 \$expected_version，实际 \${running_version:-<无法解析>}\" >&2
               docker compose ps
               docker compose logs --tail=120 sub2api
               exit 1
             fi &&
             echo \"部署版本校验通过: \$running_version\""
