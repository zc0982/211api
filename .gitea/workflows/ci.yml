name: ci

"on":
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: go-1.26.5
    steps:
      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Compute Go cache key
        id: cache_key
        run: printf 'key=%s\n' "$(./tools/gitea-cache-key.sh go)" >>"$GITEA_OUTPUT"
      - name: Restore Go cache
        id: go_cache
        continue-on-error: true
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ steps.cache_key.outputs.key }}
      - name: Record Go cache result
        run: printf 'go-cache-hit=%s\n' '${{ steps.go_cache.outputs.cache-hit }}'
      - run: ./tools/gitea-ci.sh shell-syntax
      - run: ./tools/gitea-ci.sh backend-unit
      - run: GITEA_CI=true ./tools/gitea-ci.sh backend-integration
      - run: ./tools/gitea-ci.sh lint

  required:
    name: required
    if: always()
    needs: backend
    runs-on: node-20.20.2
    steps:
      - name: Require backend to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_RESULT" == success ]]
      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Compute pnpm cache key
        id: cache_key
        run: printf 'key=%s\n' "$(./tools/gitea-cache-key.sh pnpm)" >>"$GITEA_OUTPUT"
      - name: Restore pnpm cache
        id: pnpm_cache
        continue-on-error: true
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /root/.cache/corepack
            /root/.local/share/pnpm/store
          key: ${{ steps.cache_key.outputs.key }}
      - name: Record pnpm cache result
        run: printf 'pnpm-cache-hit=%s\n' '${{ steps.pnpm_cache.outputs.cache-hit }}'
      - run: ./tools/gitea-ci.sh frontend
