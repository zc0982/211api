name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend_unit:
    name: backend-unit
    runs-on: go-1.26.5
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: ./tools/gitea-ci.sh backend-unit

  backend_integration:
    name: backend-integration
    runs-on: go-1.26.5
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: GITEA_CI=true ./tools/gitea-ci.sh backend-integration

  frontend:
    name: frontend
    runs-on: node-20.20.2
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: ./tools/gitea-ci.sh frontend

  lint:
    name: lint
    runs-on: go-1.26.5
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: ./tools/gitea-ci.sh lint

  shell_syntax:
    name: shell-syntax
    runs-on: linux-amd64
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: ./tools/gitea-ci.sh shell-syntax

  required:
    name: required
    if: always()
    needs:
      - backend_unit
      - backend_integration
      - frontend
      - lint
      - shell_syntax
    runs-on: linux-amd64
    steps:
      - name: Require every CI job to succeed
        env:
          BACKEND_UNIT_RESULT: ${{ needs.backend_unit.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs.backend_integration.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SHELL_SYNTAX_RESULT: ${{ needs.shell_syntax.result }}
        run: |
          set -euo pipefail
          for result in \
            "$BACKEND_UNIT_RESULT" \
            "$BACKEND_INTEGRATION_RESULT" \
            "$FRONTEND_RESULT" \
            "$LINT_RESULT" \
            "$SHELL_SYNTAX_RESULT"; do
            [[ "$result" == success ]]
          done
