name: deploy

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: go-1.26.5
    steps:
      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Compute Go cache key
        id: cache_key
        run: printf 'key=%s\n' "$(./tools/gitea-cache-key.sh go)" >>"$GITEA_OUTPUT"
      - name: Restore Go cache
        id: go_cache
        continue-on-error: true
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ steps.cache_key.outputs.key }}
      - name: Record Go cache result
        run: printf 'go-cache-hit=%s\n' '${{ steps.go_cache.outputs.cache-hit }}'
      - run: ./tools/gitea-ci.sh shell-syntax
      - run: ./tools/gitea-ci.sh backend-unit
      - run: GITEA_CI=true ./tools/gitea-ci.sh backend-integration
      - run: ./tools/gitea-ci.sh lint
      - run: ./tools/gitea-ci.sh security-backend

  verify:
    name: verify
    if: always()
    needs: backend
    runs-on: node-20.20.2
    steps:
      - name: Require backend to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_RESULT" == success ]]
      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Compute pnpm cache key
        id: cache_key
        run: printf 'key=%s\n' "$(./tools/gitea-cache-key.sh pnpm)" >>"$GITEA_OUTPUT"
      - name: Restore pnpm cache
        id: pnpm_cache
        continue-on-error: true
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /root/.cache/corepack
            /root/.local/share/pnpm/store
          key: ${{ steps.cache_key.outputs.key }}
      - name: Record pnpm cache result
        run: printf 'pnpm-cache-hit=%s\n' '${{ steps.pnpm_cache.outputs.cache-hit }}'
      - run: ./tools/gitea-ci.sh frontend-all

  build_deploy:
    name: build-and-deploy
    needs:
      - verify
    runs-on: docker-29.6.1
    steps:
      - name: Install locked-job helper commands
        shell: sh
        run: apk add --no-cache bash curl jq git openssh-client coreutils
      - name: Checkout exact main commit
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Publish immutable image and deploy Gateway
        shell: bash
        env:
          EVENT_SHA: ${{ gitea.sha }}
          EVENT_REF: ${{ gitea.ref }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          REGISTRY_BUILD_TOKEN: ${{ secrets.REGISTRY_BUILD_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          readonly api_url=https://git.211api.com/api/v1
          readonly image=git.211api.com/211api/211api
          readonly expected_ref=refs/heads/main
          readonly zero_sha=0000000000000000000000000000000000000000
          readonly sha_pattern='^[0-9a-f]{40}$'
          readonly digest_pattern='^sha256:[0-9a-f]{64}$'

          [[ "$EVENT_REF" == "$expected_ref" ]]
          [[ "$EVENT_SHA" =~ $sha_pattern && "$EVENT_SHA" != "$zero_sha" ]]
          : "${GITEA_TOKEN:?missing Gitea Actions token}"
          : "${REGISTRY_BUILD_TOKEN:?missing REGISTRY_BUILD_TOKEN}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"

          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export DOCKER_CONFIG="$work_dir/docker-config"
          mkdir -m 0700 "$DOCKER_CONFIG"

          api_config="$work_dir/gitea-api.curl"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" >"$api_config"
          chmod 0600 "$api_config"
          unset GITEA_TOKEN

          get_main_head() {
            curl --config "$api_config" \
              --silent --show-error --fail \
              --connect-timeout 5 --max-time 20 \
              "$api_url/repos/211api/211api/branches/main" |
              jq -er '
                select(.protected == true)
                | .commit.id
                | select(type == "string" and test("^[0-9a-f]{40}$"))
              '
          }

          inspect_digest() {
            local reference=$1
            local output=$2
            docker buildx imagetools inspect "$reference" >"$output"
            awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }' "$output"
          }

          validate_remote_image() {
            local reference=$1
            local expected_digest=$2
            local prefix=$3
            local actual_digest

            docker buildx imagetools inspect --raw "$reference" >"${prefix}.manifest.json"
            jq -e '
              (.mediaType == "application/vnd.oci.image.manifest.v1+json"
               or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
              and (has("manifests") | not)
            ' "${prefix}.manifest.json" >/dev/null
            docker buildx imagetools inspect --format '{{json .Image}}' "$reference" \
              >"${prefix}.image.json"
            jq -e --arg sha "$EVENT_SHA" '
              .os == "linux"
              and .architecture == "amd64"
              and .config.Labels["org.opencontainers.image.revision"] == $sha
            ' "${prefix}.image.json" >/dev/null
            actual_digest="$(inspect_digest "$reference" "${prefix}.inspect")"
            [[ "$actual_digest" == "$expected_digest" ]]
          }

          source deploy/gitea/images.lock.env
          version="$(tr -d '\r\n' <backend/cmd/server/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit_date="$(git show -s --format=%cI "$EVENT_SHA")"
          [[ -n "$commit_date" ]]
          sha_ref="$image:$EVENT_SHA"
          metadata_file="$work_dir/build-metadata.json"

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            --metadata-file "$metadata_file" \
            --tag "$sha_ref" \
            --build-arg "NODE_IMAGE=$APP_NODE_IMAGE" \
            --build-arg "GOLANG_IMAGE=$APP_GO_IMAGE" \
            --build-arg "ALPINE_IMAGE=$APP_ALPINE_IMAGE" \
            --build-arg "POSTGRES_IMAGE=$APP_POSTGRES_IMAGE" \
            --build-arg "VERSION=$version" \
            --build-arg "COMMIT=$EVENT_SHA" \
            --build-arg "DATE=$commit_date" \
            --label org.opencontainers.image.source=https://git.211api.com/211api/211api \
            --label "org.opencontainers.image.revision=$EVENT_SHA" \
            --label "org.opencontainers.image.version=$EVENT_SHA" \
            --label "org.opencontainers.image.created=$commit_date" \
            .

          candidate_digest="$(jq -er '
            .["containerimage.digest"]
            | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' "$metadata_file")"
          [[ "$candidate_digest" =~ $digest_pattern ]]

          current_head="$(get_main_head)"
          if [[ "$current_head" != "$EVENT_SHA" ]]; then
            printf 'Superseded before Registry publication: %s is now main.\n' "$current_head"
            exit 0
          fi

          printf '%s' "$REGISTRY_BUILD_TOKEN" |
            docker login git.211api.com --username svc-build --password-stdin
          unset REGISTRY_BUILD_TOKEN

          existing_inspect="$work_dir/existing.inspect"
          existing_error="$work_dir/existing.error"
          if docker buildx imagetools inspect "$sha_ref" >"$existing_inspect" 2>"$existing_error"; then
            existing_digest="$(awk '
              $1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }
            ' "$existing_inspect")"
            [[ "$existing_digest" =~ $digest_pattern ]]
            if [[ "$existing_digest" != "$candidate_digest" ]]; then
              printf 'Refusing conflicting immutable SHA tag %s.\n' "$sha_ref" >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|not found' "$existing_error"; then
            docker push "$sha_ref"
          else
            printf 'Unable to determine whether immutable SHA tag exists.\n' >&2
            sed -n '1,20p' "$existing_error" >&2
            exit 1
          fi

          validate_remote_image "$sha_ref" "$candidate_digest" "$work_dir/sha"

          current_head="$(get_main_head)"
          if [[ "$current_head" != "$EVENT_SHA" ]]; then
            printf 'Superseded after immutable publication; leaving only %s.\n' "$sha_ref"
            exit 0
          fi

          key_file="$work_dir/deploy-key"
          known_hosts_file="$work_dir/deploy-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS

          ssh -F /dev/null \
            -i "$key_file" \
            -p 4422 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts_file" \
            root@157.254.234.244 \
            "deploy --commit $EVENT_SHA --digest $candidate_digest"

          current_head="$(get_main_head)"
          if [[ "$current_head" != "$EVENT_SHA" ]]; then
            printf 'Main advanced after Gateway health; a newer job will converge it.\n'
            exit 0
          fi

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$image:main" \
            "$image@$candidate_digest"
          main_digest="$(inspect_digest "$image:main" "$work_dir/main.inspect")"
          [[ "$main_digest" == "$candidate_digest" ]]
          post_tag_head="$(get_main_head)"
          if [[ "$post_tag_head" != "$EVENT_SHA" ]]; then
            # Do not roll the pointer back: the serialized newer job is the safe
            # convergence path for this acknowledged cross-host race.
            printf 'Main advanced during pointer update; queued head %s must converge it.\n' \
              "$post_tag_head"
          fi

  notify:
    name: telegram-notification
    if: always()
    needs:
      - verify
      - build_deploy
    runs-on: linux-amd64
    steps:
      - name: Notify final deployment result through Pipedream
        shell: bash
        env:
          BUILD_DEPLOY_RESULT: ${{ needs.build_deploy.result }}
          EVENT_SHA: ${{ gitea.sha }}
          PIPEDREAM_NOTIFY_URL: ${{ secrets.PIPEDREAM_NOTIFY_URL }}
          RUN_URL: https://git.211api.com/211api/211api/actions/runs/${{ gitea.run_id }}
        run: |
          set -u
          set +x

          if [[ -z "$PIPEDREAM_NOTIFY_URL" ]]; then
            printf 'deployment-notification-outcome=skipped\n'
            printf 'Deployment notification skipped: Pipedream endpoint is not configured.\n' >&2
            exit 0
          fi

          DEPLOYMENT_STATUS=failed
          if [[ "$BUILD_DEPLOY_RESULT" == success ]]; then
            DEPLOYMENT_STATUS=success
          fi
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DEPLOYMENT_STATUS FINISHED_AT

          if ! node --input-type=module -e '
            const endpoint = process.env.PIPEDREAM_NOTIFY_URL;
            const payload = {
              schema: "gitea-deployment-notification.v1",
              event: "deployment-finished",
              status: process.env.DEPLOYMENT_STATUS,
              finished_at: process.env.FINISHED_AT,
              repository: "211api/211api",
              commit: process.env.EVENT_SHA,
              run_url: process.env.RUN_URL,
            };
            const endpointSuffix = ".m.pipedream.net";
            let outcome;
            let exitCode = 0;
            if (typeof endpoint !== "string" || !endpoint.startsWith("https://") ||
                /\s/.test(endpoint)) {
              outcome = "endpoint-validation";
              exitCode = 2;
            }
            let parsedEndpoint;
            if (exitCode === 0) {
              try {
                parsedEndpoint = new URL(endpoint);
              } catch {
                outcome = "endpoint-validation";
                exitCode = 2;
              }
            }
            if (exitCode === 0) {
              const authority = endpoint.slice(endpoint.indexOf("://") + 3).split(/[/?#]/, 1)[0];
              if (parsedEndpoint.protocol !== "https:" ||
                  parsedEndpoint.username !== "" || parsedEndpoint.password !== "" ||
                  authority !== parsedEndpoint.hostname ||
                  parsedEndpoint.hostname.length <= endpointSuffix.length ||
                  !parsedEndpoint.hostname.endsWith(endpointSuffix)) {
                outcome = "endpoint-validation";
                exitCode = 2;
              }
            }
            if (exitCode === 0 && (!/^[0-9a-f]{40}$/.test(payload.commit) ||
                !/^https:\/\/git\.211api\.com\/211api\/211api\/actions\/runs\/[1-9][0-9]{0,19}$/.test(payload.run_url))) {
              outcome = "input-validation";
              exitCode = 2;
            }
            const httpOutcome = (status) => {
              if (!Number.isInteger(status) || status < 100 || status > 599) {
                return "http-other";
              }
              if (status >= 300 && status < 400) return `http-3xx-${status}`;
              if (status >= 400 && status < 500) return `http-4xx-${status}`;
              if (status >= 500 && status < 600) return `http-5xx-${status}`;
              return `http-other-${status}`;
            };
            if (exitCode === 0) {
              const controller = new AbortController();
              let timedOut = false;
              const timeout = setTimeout(() => {
                timedOut = true;
                controller.abort();
              }, 15_000);
              try {
                const response = await fetch(endpoint, {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify(payload),
                  signal: controller.signal,
                  redirect: "manual",
                });
                if (!response.ok) {
                  outcome = httpOutcome(response.status);
                  exitCode = 3;
                } else {
                  const responseText = await response.text();
                  let result;
                  try {
                    result = JSON.parse(responseText);
                  } catch {
                    outcome = "invalid-json";
                    exitCode = 3;
                  }
                  if (exitCode === 0) {
                    if (result?.ok !== true || result?.event !== "deployment-finished") {
                      outcome = "response-contract";
                      exitCode = 3;
                    } else {
                      outcome = "accepted";
                    }
                  }
                }
              } catch {
                outcome = timedOut ? "timeout" : "network";
                exitCode = 4;
              } finally {
                clearTimeout(timeout);
              }
            }
            console.log(`deployment-notification-outcome=${outcome}`);
            if (exitCode !== 0) process.exitCode = exitCode;
          '; then
            printf 'Deployment notification delivery failed; deployment result is unchanged.\n' >&2
          fi
