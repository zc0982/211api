name: security

"on":
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: go-1.26.5
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: ./tools/gitea-ci.sh security-backend

  frontend:
    name: frontend
    runs-on: node-20.20.2
    steps:
      - name: Require an internal pull request
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          fi
      - uses: https://gitea.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: ./tools/gitea-ci.sh security-frontend

  required:
    name: required
    if: always()
    needs:
      - backend
      - frontend
    runs-on: linux-amd64
    steps:
      - name: Require every security job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_RESULT" == success ]]
          [[ "$FRONTEND_RESULT" == success ]]
