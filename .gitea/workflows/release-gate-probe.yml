name: release-gate-probe

"on":
  push:
    branches:
      - fix/gitea-release-actor-gate

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: docker-29.6.1
    steps:
      - name: Install helper commands
        shell: sh
        run: apk add --no-cache bash curl jq
      - name: Probe job-token authorization endpoints
        shell: bash
        env:
          EVENT_ACTOR: ${{ gitea.actor }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          : "${GITEA_TOKEN:?missing Gitea Actions token}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT
          api_config="$work_dir/gitea-api.curl"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" >"$api_config"
          chmod 0600 "$api_config"
          unset GITEA_TOKEN

          probe() {
            local label=$1 url=$2 output="$work_dir/$1.json" status
            status="$(curl --config "$api_config" \
              --silent --show-error \
              --connect-timeout 5 --max-time 20 \
              --output "$output" --write-out '%{http_code}' "$url")"
            printf '%s_STATUS=%s\n' "$label" "$status"
          }

          readonly api_url=https://git.211api.com/api/v1
          probe self "$api_url/user"
          if jq -e --arg actor "$EVENT_ACTOR" '.login == $actor' \
            "$work_dir/self.json" >/dev/null 2>&1; then
            printf 'SELF_EQUALS_ACTOR=true\n'
          else
            printf 'SELF_EQUALS_ACTOR=false\n'
          fi

          probe protections "$api_url/repos/211api/211api/branch_protections"
          if jq -e '
            any(.[];
              (.rule_name // .branch_name) == "release/v*"
              and .enable_push == true
              and .enable_push_whitelist == true
              and (.push_whitelist_usernames | sort) == []
              and (.push_whitelist_teams | sort) == ["release-maintainers"]
              and .enable_force_push == false
            )
          ' "$work_dir/protections.json" >/dev/null 2>&1; then
            printf 'RELEASE_PROTECTION_EXACT=true\n'
          else
            printf 'RELEASE_PROTECTION_EXACT=false\n'
          fi

          probe org_teams "$api_url/orgs/211api/teams?limit=50"
          team_id="$(jq -er '
            [.[] | select(.name == "release-maintainers")] as $matches
            | select(($matches | length) == 1)
            | $matches[0].id
            | select(type == "number" and . > 0)
          ' "$work_dir/org_teams.json" 2>/dev/null || true)"
          if [[ "$team_id" =~ ^[1-9][0-9]*$ ]]; then
            probe actor_member "$api_url/teams/$team_id/members/$EVENT_ACTOR"
          else
            printf 'ACTOR_MEMBER_STATUS=unavailable\n'
          fi

          probe actor_permission \
            "$api_url/repos/211api/211api/collaborators/$EVENT_ACTOR/permission"
          if jq -e '.permission == "write" or .permission == "admin"' \
            "$work_dir/actor_permission.json" >/dev/null 2>&1; then
            printf 'ACTOR_REPO_WRITE=true\n'
          else
            printf 'ACTOR_REPO_WRITE=false\n'
          fi
