name: release

"on":
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  request_tag:
    name: request-tag
    runs-on: docker-29.6.1
    steps:
      - name: Install locked-job helper commands
        shell: sh
        run: apk add --no-cache bash curl jq git openssh-client
      - name: Checkout release request
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Validate request and create annotated tag over SSH
        shell: bash
        env:
          EVENT_ACTOR: ${{ gitea.actor }}
          EVENT_BEFORE: ${{ gitea.event.before }}
          EVENT_REF: ${{ gitea.ref }}
          EVENT_SHA: ${{ gitea.sha }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          REGISTRY_RELEASE_TOKEN: ${{ secrets.REGISTRY_RELEASE_TOKEN }}
          RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
          RELEASE_TAG_KNOWN_HOSTS: ${{ secrets.RELEASE_TAG_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          readonly api_url=https://git.211api.com/api/v1
          readonly image=git.211api.com/211api/211api
          readonly tag_remote=ssh://git@git.211api.com:2222/211api/211api.git
          readonly zero_sha=0000000000000000000000000000000000000000
          readonly sha_pattern='^[0-9a-f]{40}$'
          readonly tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'

          if [[ "$EVENT_REF" != refs/heads/release/v* ]]; then
            printf 'Not a release request branch; request lane skipped.\n'
            exit 0
          fi
          [[ "$EVENT_BEFORE" == "$zero_sha" ]]
          [[ "$EVENT_SHA" =~ $sha_pattern && "$EVENT_SHA" != "$zero_sha" ]]
          [[ "$EVENT_ACTOR" =~ ^[0-9A-Za-z_.-]+$ ]]
          : "${GITEA_TOKEN:?missing Gitea Actions token}"
          : "${REGISTRY_RELEASE_TOKEN:?missing REGISTRY_RELEASE_TOKEN}"
          : "${RELEASE_TAG_SSH_KEY:?missing RELEASE_TAG_SSH_KEY}"
          : "${RELEASE_TAG_KNOWN_HOSTS:?missing RELEASE_TAG_KNOWN_HOSTS}"

          tag="${EVENT_REF#refs/heads/release/}"
          [[ "$tag" =~ $tag_pattern ]]
          version="$(tr -d '\r\n' <backend/cmd/server/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tag" == "v$version" || "$tag" == "v$version-"* ]]

          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export DOCKER_CONFIG="$work_dir/docker-config"
          mkdir -m 0700 "$DOCKER_CONFIG"

          api_config="$work_dir/gitea-api.curl"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" >"$api_config"
          chmod 0600 "$api_config"
          unset GITEA_TOKEN

          api_get() {
            curl --config "$api_config" \
              --silent --show-error --fail \
              --connect-timeout 5 --max-time 20 \
              "$1"
          }

          api_get "$api_url/user" >"$work_dir/user.json"
          jq -e --arg actor "$EVENT_ACTOR" '.login == $actor' \
            "$work_dir/user.json" >/dev/null
          api_get "$api_url/user/teams" >"$work_dir/teams.json"
          jq -e '
            any(.[];
              .name == "release-maintainers"
              and ((.organization.username // .organization.name // "") == "211api")
            )
          ' "$work_dir/teams.json" >/dev/null

          api_get "$api_url/repos/211api/211api/branches/main" >"$work_dir/main.json"
          main_sha="$(jq -er '
            select(.protected == true)
            | .commit.id
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' "$work_dir/main.json")"
          [[ "$main_sha" == "$EVENT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_SHA" ]]

          printf '%s' "$REGISTRY_RELEASE_TOKEN" |
            docker login git.211api.com --username svc-release-package --password-stdin
          unset REGISTRY_RELEASE_TOKEN
          sha_ref="$image:$EVENT_SHA"
          docker buildx imagetools inspect --raw "$sha_ref" >"$work_dir/sha-manifest.json"
          jq -e '
            (.mediaType == "application/vnd.oci.image.manifest.v1+json"
             or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
            and (has("manifests") | not)
          ' "$work_dir/sha-manifest.json" >/dev/null
          docker buildx imagetools inspect --format '{{json .Image}}' "$sha_ref" \
            >"$work_dir/sha-image.json"
          jq -e --arg sha "$EVENT_SHA" '
            .os == "linux"
            and .architecture == "amd64"
            and .config.Labels["org.opencontainers.image.revision"] == $sha
          ' "$work_dir/sha-image.json" >/dev/null

          tag_status="$(curl --config "$api_config" \
            --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --output "$work_dir/tag.json" \
            --write-out '%{http_code}' \
            "$api_url/repos/211api/211api/tags/$tag")"
          if [[ "$tag_status" == 200 ]]; then
            printf 'Refusing existing release tag %s.\n' "$tag" >&2
            exit 1
          fi
          [[ "$tag_status" == 404 ]]

          key_file="$work_dir/release-tag-key"
          known_hosts_file="$work_dir/release-tag-known-hosts"
          printf '%s\n' "$RELEASE_TAG_SSH_KEY" >"$key_file"
          printf '%s\n' "$RELEASE_TAG_KNOWN_HOSTS" >"$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"
          unset RELEASE_TAG_SSH_KEY RELEASE_TAG_KNOWN_HOSTS

          git config user.name svc-release-tag
          git config user.email svc-release-tag@211api.invalid
          git tag -a "$tag" "$EVENT_SHA" -m "Release $tag"
          GIT_SSH_COMMAND="ssh -F /dev/null -p 2222 -i $key_file -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file" \
            git push "$tag_remote" "refs/tags/$tag:refs/tags/$tag"

  publish:
    name: publish
    runs-on: docker-29.6.1
    steps:
      - name: Install locked-job helper commands
        shell: sh
        run: apk add --no-cache bash curl jq git
      - name: Checkout protected tag
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Retag immutable digest and create Gitea Release
        shell: bash
        env:
          EVENT_REF: ${{ gitea.ref }}
          REGISTRY_RELEASE_TOKEN: ${{ secrets.REGISTRY_RELEASE_TOKEN }}
          RELEASE_RECORD_TOKEN: ${{ secrets.RELEASE_RECORD_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          readonly api_url=https://git.211api.com/api/v1
          readonly image=git.211api.com/211api/211api
          readonly sha_pattern='^[0-9a-f]{40}$'
          readonly digest_pattern='^sha256:[0-9a-f]{64}$'
          readonly tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          readonly stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$EVENT_REF" != refs/tags/v* ]]; then
            printf 'Not a protected release tag; publication lane skipped.\n'
            exit 0
          fi
          : "${REGISTRY_RELEASE_TOKEN:?missing REGISTRY_RELEASE_TOKEN}"
          : "${RELEASE_RECORD_TOKEN:?missing RELEASE_RECORD_TOKEN}"

          tag="${EVENT_REF#refs/tags/}"
          [[ "$tag" =~ $tag_pattern ]]
          [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]]
          commit_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          [[ "$commit_sha" =~ $sha_pattern ]]
          version="$(tr -d '\r\n' <backend/cmd/server/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tag" == "v$version" || "$tag" == "v$version-"* ]]

          if [[ "$tag" =~ $stable_tag_pattern ]]; then
            prerelease_json=false
          else
            prerelease_json=true
          fi

          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export DOCKER_CONFIG="$work_dir/docker-config"
          mkdir -m 0700 "$DOCKER_CONFIG"

          release_api_config="$work_dir/release-api.curl"
          printf 'header = "Authorization: token %s"\n' "$RELEASE_RECORD_TOKEN" \
            >"$release_api_config"
          chmod 0600 "$release_api_config"
          unset RELEASE_RECORD_TOKEN

          printf '%s' "$REGISTRY_RELEASE_TOKEN" |
            docker login git.211api.com --username svc-release-package --password-stdin
          unset REGISTRY_RELEASE_TOKEN

          inspect_digest() {
            local reference=$1
            local output=$2
            docker buildx imagetools inspect "$reference" >"$output"
            awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }' "$output"
          }

          validate_sha_image() {
            local reference=$1
            local prefix=$2
            docker buildx imagetools inspect --raw "$reference" >"${prefix}.manifest.json"
            jq -e '
              (.mediaType == "application/vnd.oci.image.manifest.v1+json"
               or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
              and (has("manifests") | not)
            ' "${prefix}.manifest.json" >/dev/null
            docker buildx imagetools inspect --format '{{json .Image}}' "$reference" \
              >"${prefix}.image.json"
            jq -e --arg sha "$commit_sha" '
              .os == "linux"
              and .architecture == "amd64"
              and .config.Labels["org.opencontainers.image.revision"] == $sha
            ' "${prefix}.image.json" >/dev/null
          }

          sha_ref="$image:$commit_sha"
          validate_sha_image "$sha_ref" "$work_dir/sha"
          sha_digest="$(inspect_digest "$sha_ref" "$work_dir/sha.inspect")"
          [[ "$sha_digest" =~ $digest_pattern ]]

          version_ref="$image:$tag"
          version_inspect="$work_dir/version.inspect"
          version_error="$work_dir/version.error"
          if docker buildx imagetools inspect "$version_ref" >"$version_inspect" 2>"$version_error"; then
            version_digest="$(awk '
              $1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }
            ' "$version_inspect")"
            [[ "$version_digest" =~ $digest_pattern ]]
            if [[ "$version_digest" != "$sha_digest" ]]; then
              printf 'Refusing conflicting version tag %s.\n' "$version_ref" >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|not found' "$version_error"; then
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$version_ref" \
              "$image@$sha_digest"
          else
            printf 'Unable to determine whether version tag exists.\n' >&2
            sed -n '1,20p' "$version_error" >&2
            exit 1
          fi

          version_digest="$(inspect_digest "$version_ref" "$work_dir/version-final.inspect")"
          [[ "$version_digest" == "$sha_digest" ]]
          validate_sha_image "$version_ref" "$work_dir/version"

          if [[ "$prerelease_json" == false ]]; then
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$image:latest" \
              "$image@$sha_digest"
            latest_digest="$(inspect_digest "$image:latest" "$work_dir/latest.inspect")"
            [[ "$latest_digest" == "$sha_digest" ]]
          fi

          tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/$tag")"
          image_reference="$version_ref@$sha_digest"
          release_body="$(printf '%s\n\nRegistry image: `%s`' "$tag_message" "$image_reference")"

          validate_release() {
            local release_file=$1
            jq -e \
              --arg tag "$tag" \
              --arg sha "$commit_sha" \
              --arg image_reference "$image_reference" \
              --argjson prerelease "$prerelease_json" '
                .tag_name == $tag
                and .target_commitish == $sha
                and .prerelease == $prerelease
                and .draft == false
                and (.body | contains($image_reference))
              ' "$release_file" >/dev/null
          }

          release_status="$(curl --config "$release_api_config" \
            --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --output "$work_dir/existing-release.json" \
            --write-out '%{http_code}' \
            "$api_url/repos/211api/211api/releases/tags/$tag")"

          if [[ "$release_status" == 200 ]]; then
            validate_release "$work_dir/existing-release.json"
            exit 0
          fi
          [[ "$release_status" == 404 ]]

          jq -n \
            --arg tag_name "$tag" \
            --arg target_commitish "$commit_sha" \
            --arg name "$tag" \
            --arg body "$release_body" \
            --argjson prerelease "$prerelease_json" '
              {
                tag_name: $tag_name,
                target_commitish: $target_commitish,
                name: $name,
                body: $body,
                draft: false,
                prerelease: $prerelease
              }
            ' >"$work_dir/release.json"
          create_status="$(curl --config "$release_api_config" \
            --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --header 'Content-Type: application/json' \
            --data-binary "@$work_dir/release.json" \
            --output "$work_dir/created-release.json" \
            --write-out '%{http_code}' \
            "$api_url/repos/211api/211api/releases" \
          )"
          if [[ "$create_status" == 201 ]]; then
            validate_release "$work_dir/created-release.json"
            exit 0
          fi
          if [[ "$create_status" != 409 ]]; then
            printf 'Gitea Release creation returned HTTP %s.\n' "$create_status" >&2
            exit 1
          fi

          concurrent_status="$(curl --config "$release_api_config" \
            --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --output "$work_dir/concurrent-release.json" \
            --write-out '%{http_code}' \
            "$api_url/repos/211api/211api/releases/tags/$tag")"
          [[ "$concurrent_status" == 200 ]]
          validate_release "$work_dir/concurrent-release.json"
